name: my_space
description: My SPACE — notes, keyvault, subscriptions, todos, map pins, password generator.
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (sqflite — no codegen needed)
  sqflite: ^2.3.3+1
  path: ^1.9.1

  # Secure storage (vault key persistence)
  flutter_secure_storage: ^9.2.4

  # Crypto
  pointycastle: ^3.9.1

  # Google Sign-In (for sync)
  google_sign_in: ^6.3.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  googleapis: ^13.2.0

  # Markdown rendering
  flutter_markdown: ^0.7.7+1

  # Image picking
  image_picker: ^1.2.3

  # URL launcher (map pins)
  url_launcher: ^6.3.2

  # intl
  intl: ^0.19.0

  # Path provider
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
